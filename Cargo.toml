[workspace]
# `tools/gallery` builds the theoria CLI for `cargo theoria`.
members = ["crates/*", "tools/*"]
# A plain `cargo build` leaves the CLI out; `cargo theoria` names it.
default-members = ["crates/*"]
# The browser tests: their own lockfile and their own CI job, so the
# workspace builds without playwright-rs or a browser.
exclude = ["crates/pyle-e2e"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/padamson/pyle"
authors = ["Paul Adamson"]
# Consumed through git, pinned to a SHA; not released to crates.io.
publish = false

[workspace.lints.rust]
# Nothing here has a reason to reach for unsafe. `deny` (not `forbid`)
# leaves a targeted `#[allow(unsafe_code)]` escape hatch if a future FFI
# edge genuinely needs one.
unsafe_code = "deny"

# The place for the clippy lints these crates turn on; the template
# imposes none.
[workspace.lints.clippy]

[workspace.dependencies]
leptos = { version = "0.8", default-features = false }
leptotes = { git = "https://github.com/padamson/leptotes", branch = "main" }
pyle-core = { path = "crates/pyle-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
theoria = { git = "https://github.com/padamson/theoria", branch = "main" }
# The same `git` and `branch` as `theoria`, so the two lock to one commit.
theoria-cli = { git = "https://github.com/padamson/theoria", branch = "main" }
