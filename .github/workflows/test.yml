name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  skill-version:
    name: Skill version guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The pre-commit hook of the same name is per-clone and opt-in, so a
    # hookless clone or a `--no-verify` commit would ship a skill edit
    # without the version bump installed consumers key their updates on.
    # Same script, run against the PR base or the tip before the push.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute diff base
        id: base
        uses: ./.github/actions/diff-base

      # The script treats an unusable ref as an error; skipping when there
      # is nothing to compare against is this job's call, not the script's.
      - name: Check the skill version against the base
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No reachable base (first push, manual run, or rewritten history); nothing to compare."
            exit 0
          fi
          scripts/check-skill-version-bumped.sh --base "$BASE"

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"

      # If your crate uses `include_bytes!` against build-generated
      # artifacts (wasm pkgs, codegen output, etc.), stub them with
      # `touch` here so `cargo check` succeeds — the bytes aren't
      # exercised at compile time, only their existence on disk is.
      # `--all-features` so the `stories` feature's theoria, which sets
      # the MSRV, is checked too.
      - name: Check compilation on MSRV
        run: cargo check --workspace --all-features

  wasm:
    name: Build for wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Sites build pyle for the browser under Leptos's csr feature, which
    # the native jobs never compile.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: wasm

      # A virtual workspace takes `--features` only beside `-p`.
      - name: Build the components for wasm32
        run: cargo build -p pyle --lib --target wasm32-unknown-unknown --features csr --locked

      # The theoria gallery builds the stories for the browser too.
      - name: Build the components and their stories for wasm32
        run: cargo build -p pyle --lib --target wasm32-unknown-unknown --features csr,stories --locked

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      # pyle-e2e is outside the workspace, so `--all` above skips it.
      - name: Check formatting (pyle-e2e)
        run: cargo fmt --manifest-path crates/pyle-e2e/Cargo.toml -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # pyle-e2e is outside the workspace, so the step above skips it.
      # playwright-rs's build script downloads the Playwright driver, which
      # a compile-only job never runs.
      - name: Run clippy (pyle-e2e)
        env:
          PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
        run: cargo clippy --locked --manifest-path crates/pyle-e2e/Cargo.toml --all-targets -- -D warnings

      # nextest does not run doctests, so this is its own step. The
      # workspace keeps at least one doctest (pyle-core's crate docs have one),
      # which is what makes this step honest; delete the step if the
      # workspace ever has none rather than running a no-op. The guard is
      # on library targets, not on doctests: `cargo test --doc` errors
      # outright when no crate has a library, so the step goes with a
      # `src/lib.rs` in any crate.
      # `--all-features` so the doctests on items behind `stories`
      # (`pyle::stories_for`) run.
      - name: Run doc-tests
        if: hashFiles('**/src/lib.rs') != ''
        run: cargo test --doc --workspace --all-features

      - name: Generate documentation
        run: cargo doc --no-deps --workspace

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # nextest's slow-timeout catches a hung test; this catches a hung
    # runner or a wedged tool install.
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test

      # Every install-action step sets `fallback: none`. The default,
      # `cargo-binstall`, checks no checksum, and it quietly installs a
      # tool missing from the action's manifest instead of failing. If a
      # step fails as "not supported", install that tool with `cargo
      # install --locked` (and `--force` after a cache step that restores
      # `~/.cargo/bin`) rather than delete the line.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-nextest
          fallback: none

      - name: Build
        run: cargo build --verbose

      # `--profile ci` (.config/nextest.toml): retries on, so a retried
      # pass is reported FLAKY instead of hiding, and a longer slow-timeout.
      - name: Run tests
        run: cargo nextest run --workspace --profile ci

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only check on what a browser decides: that a site's utilities
    # outrank pyle's cascade layer, that the version bar reads a manifest
    # pyle-cli wrote, and that picking a version opens it. The tests drive
    # the theoria gallery built from pyle's stories with playwright-rs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: e2e
          workspaces: |
            .
            crates/pyle-e2e

      - name: Install Trunk and cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: trunk,cargo-nextest
          fallback: none

      # The CLI is built from the theoria commit Cargo.lock holds for the
      # stories, so Dependabot's cargo entry moves it with the library.
      # `--force` because the cache step may have restored an older one to
      # ~/.cargo/bin.
      - name: Install the theoria CLI at the locked commit
        run: |
          sha=$(sed -n 's|^source = "git+https://github.com/padamson/theoria?branch=main#\(.*\)"$|\1|p' Cargo.lock | head -n 1)
          if [ -z "$sha" ]; then
            echo "::error::Cargo.lock has no theoria commit"
            exit 1
          fi
          cargo install --locked --force --git https://github.com/padamson/theoria --rev "$sha" theoria-cli

      # The script starts the generated app from the workspace's lockfile,
      # so the gallery is built on what Cargo.lock pins and not on
      # theoria's `main` as of the run (scripts/gallery.sh says why).
      - name: Build the gallery
        run: ./scripts/gallery.sh build

      # No Playwright version here: the example asks playwright-rs for the
      # browser its driver expects, so a bump in the e2e lockfile moves the
      # browser too (crates/pyle-e2e/examples/install-browsers.rs says
      # why). `--with-deps` adds the system libraries a fresh runner lacks.
      - name: Install Chromium for the bundled Playwright driver
        run: cargo run --locked --manifest-path crates/pyle-e2e/Cargo.toml --example install-browsers -- --with-deps

      # Under nextest so the slow-timeout in .config/nextest.toml applies.
      # The e2e crate is its own workspace root, so the config is named.
      # Every test is `#[ignore]`d (it needs the gallery and Chromium), hence
      # `--run-ignored all`; each fails if the gallery is not where it looks.
      - name: Run e2e
        run: cargo nextest run --locked --manifest-path crates/pyle-e2e/Cargo.toml --config-file .config/nextest.toml --profile ci --run-ignored all
