[package]
name = "pyle"
description = "Shared landing-page components for Leptos sites"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
categories = ["gui", "web-programming", "wasm"]
keywords = ["leptos", "components", "landing-page"]

[lints]
workspace = true

[dependencies]
# A library must not turn on a Leptos runtime (csr, ssr, hydrate); the site
# picks one through the passthrough features below.
leptos = { workspace = true }
# The version model: what a snapshot is, the manifest, and the URLs.
pyle-core = { workspace = true }
# Reads the site's versions.json in the browser.
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
# Only for the colocated `*.stories.rs` files (the `stories` feature),
# never in a site's build.
theoria = { workspace = true, optional = true }

[dev-dependencies]
# Renders a component to its SSR HTML in a plain test.
leptotes = { workspace = true }
# The stories compile in every test build too, so the leptotes tests in
# the `*.stories.rs` files run under a plain `cargo nextest run`.
theoria = { workspace = true }

[features]
csr = ["leptos/csr", "theoria?/csr"]
ssr = ["leptos/ssr", "theoria?/ssr"]
hydrate = ["leptos/hydrate", "theoria?/hydrate"]
# Compiles the component stories for the theoria gallery.
stories = ["dep:theoria"]
