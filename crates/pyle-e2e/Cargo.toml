# Outside the workspace (the root `exclude`s it), with its own Cargo.lock:
# pyle's browser tests. They serve the theoria gallery built from pyle's
# stories, beside a site that pyle-cli deploys for the test, and drive both
# in Chromium with playwright-rs.
[package]
name = "pyle-e2e"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/padamson/pyle"
authors = ["Paul Adamson"]
publish = false

[dev-dependencies]
playwright-rs = { git = "https://github.com/padamson/playwright-rust", branch = "main" }
# Deploys the site the version switcher reads, the way a site's workflow does.
pyle-cli = { path = "../pyle-cli" }
pyle-core = { path = "../pyle-core" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["fs"] }
anyhow = "1"
tempfile = "3"
